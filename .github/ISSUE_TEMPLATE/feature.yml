name: Feature request
description: A marker file, ecosystem or behaviour you'd like detected or supported.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe your monorepo and what you want CI to build, test or deploy.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would help?
