name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable && yarn install --immutable
      - run: yarn typecheck
      - name: Rebuild dist and verify it is committed
        run: |
          node scripts/build.mjs
          git diff --exit-code -- dist/ || { echo "::error::dist/ is stale. Run 'yarn build' and commit."; exit 1; }
      - run: yarn test
      - name: Benchmarks
        run: node bench/bench.ts | tee -a "$GITHUB_STEP_SUMMARY"
