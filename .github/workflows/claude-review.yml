name: Claude CI

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, review_requested]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: claude-review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'review_requested' ||
       github.event.requested_team.slug == 'claude-review')
    uses: OpenMind-SI/.github/.github/workflows/claude-review.yml@c3b1ca2e480d0df7254849b85dde06283a3b6862
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
      id-token: write
