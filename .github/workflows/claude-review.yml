name: CI

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, review_requested]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: claude-review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'review_requested' ||
       github.event.requested_team.slug == 'claude-review')
    uses: OpenMind-SI/.github/.github/workflows/claude-review.yml@2ebed5ad0b5b643b409b173d6e6534e6dbe5584b
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
